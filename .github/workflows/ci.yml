name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOOME_BACKEND: test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build
      - name: run on the test backend
        run: |
          mkdir -p shots
          out=$(GOOME_TEST_SHOTS=shots GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 60,28; end 6" cargo run -q)
          echo "$out"
          ls shots | grep -q ppm
          if [ -d variants ]; then echo "$out" | grep -q "overlay mode"; fi
      - name: other templates
        if: hashFiles('variants/**') != ''
        run: |
          for v in variants/*/; do
            n=$(basename "$v")
            d="$RUNNER_TEMP/v-$n"
            mkdir -p "$d" "shots-$n"
            cp -r Cargo.toml src "$d/"
            cp -r "$v". "$d/"
            CARGO_TARGET_DIR="$PWD/target" GOOME_TEST_SHOTS="shots-$n" GOOME_TEST_SCRIPT="screen 1280x720 1; 2 hotkey alt+m; 3 click 100,140; end 6" cargo run -q --manifest-path "$d/Cargo.toml"
            ls "shots-$n" | grep -q ppm
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ runner.os }}
          path: shots*/
          if-no-files-found: ignore
